
#cloud-config


# 1. Update the package index and timezone
timezone: Asia/Kolkata
package_update: true

# 2. Install required packages
packages:
  - docker.io
  - git
  - curl
  - ffmpeg

# 3. Create the Docker group and application user
groups:
  - docker

users:
  - default
  - name: testpress
    groups:
      - docker
    shell: /bin/bash
    lock_passwd: true

# 4. Create application files and systemd service
write_files:
  # Application environment configuration
  - path: /opt/testpress/app.env
    owner: root:root
    permissions: '0644'
    content: |
      APP_NAME=Testpress
      APP_ENV=development
      APP_PORT=8080

  # Python HTTP application
  - path: /opt/testpress/app.py
    owner: root:root
    permissions: '0644'
    content: |
      from http.server import BaseHTTPRequestHandler, HTTPServer

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == "/health":
                  message = "ok"
              else:
                  message = "Hello from Testpress!"

              self.send_response(200)
              self.send_header("Content-Type", "text/plain")
              self.end_headers()
              self.wfile.write(message.encode())

      server = HTTPServer(("0.0.0.0", 8080), Handler)
      print("Testpress application listening on port 8080")
      server.serve_forever()

  # Docker image definition
  - path: /opt/testpress/Dockerfile
    owner: root:root
    permissions: '0644'
    content: |
      FROM python:3.12-slim
      WORKDIR /app
      COPY app.py /app/app.py
      EXPOSE 8080
      HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 CMD ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      CMD ["python", "/app/app.py"]

  # systemd service for the Dockerized application
  - path: /etc/systemd/system/testpress.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Testpress Docker Application
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStartPre=/usr/bin/docker build -t testpress-app:latest /opt/testpress
      ExecStart=/usr/bin/docker run --rm --name testpress-app --publish 8080:8080 --env-file /opt/testpress/app.env testpress-app:latest
      ExecStop=/usr/bin/docker stop testpress-app
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

# 5. Commands to run after cloud-init writes the files
runcmd:
  - [mkdir, -p, /opt/testpress]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, docker.service]
  - [systemctl, enable, --now, testpress.service]
