services:
  minio:
    image: minio/minio:latest
    container_name: rclone-minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  minio-2:
    image: minio/minio:latest
    container_name: rclone-minio-2
    command: server /data
    ports:
      - "9200:9000"
    environment:
      MINIO_ROOT_USER: ${SECOND_USER}
      MINIO_ROOT_PASSWORD: ${SECOND_PASSWORD}
    volumes:
      - minio-data-2:/data

volumes:
  minio-data:
  minio-data-2:
